<!doctype html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Brak dostępu — EKOMAT Dashboard</title>

    <script>
      (function(){try{var t=localStorage.getItem('ekomat_theme');
        if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
    <div class="screen">

        <div class="switches screen-switches">
            <div class="seg">
                <button type="button" data-lang="pl">PL</button>
                <button type="button" data-lang="ru">RU</button>
            </div>
            <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="theme">&#9790;</button>
        </div>

        <div style="width:440px;max-width:100%;">

            <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:26px;">
                <span class="logo" style="font-size:23px;margin-bottom:8px;">ekomat<span class="dot">.</span></span>
                <p style="font-size:13px;color:var(--muted);margin:0;" data-i18n="panel">Panel analityczny</p>
            </div>

            <div class="card" style="padding:44px 40px;text-align:center;">
                <div style="width:46px;height:46px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
                            border-radius:13px;background:var(--chip);font-size:20px;">&#128274;</div>

                <h1 style="font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.03em;"
                    data-i18n="na_title">Brak dostępu</h1>

                <p style="font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 24px;"
                   data-i18n-html="na_text">Twoje konto nie ma przypisanych uprawnień do tej strony.<br>Skontaktuj się z administratorem, aby uzyskać dostęp.</p>

                {% if user %}
                <p style="font-size:12px;color:var(--faint);margin:0 0 22px;">{{ user.email }}</p>
                {% endif %}

                <a class="btn btn-block" href="/logout" data-i18n="logout">Wyloguj się</a>
            </div>

            <p style="text-align:center;font-size:12px;color:var(--faint);margin:18px 0 0;">
                © 2026 EKOMAT · <span data-i18n="rights">Wszystkie prawa zastrzeżone</span>
            </p>
        </div>
    </div>

    <script src="/static/i18n.js"></script>
</body>
</html>
