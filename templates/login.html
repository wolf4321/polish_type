<!doctype html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Logowanie — EKOMAT Dashboard</title>

    <script>
      /* тему ставим до отрисовки, чтобы не мигало белым */
      (function(){try{var t=localStorage.getItem('ekomat_theme');
        if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
    <div class="screen">

        <div class="switches screen-switches">
            <div class="seg">
                <button type="button" data-lang="pl">PL</button>
                <button type="button" data-lang="ru">RU</button>
            </div>
            <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="theme">&#9790;</button>
        </div>

        <div style="width:392px;max-width:100%;">

            <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:26px;">
                <span class="logo" style="font-size:23px;margin-bottom:8px;">ekomat<span class="dot">.</span></span>
                <p style="font-size:13px;color:var(--muted);margin:0;" data-i18n="panel">Panel analityczny</p>
            </div>

            <div class="card" style="padding:30px;">
                <h2 style="font-size:15px;font-weight:600;text-align:center;color:var(--ink-soft);margin:0 0 22px;letter-spacing:-.025em;"
                    data-i18n="signin">Zaloguj się do konta</h2>

                {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

                <form method="POST" action="/login">
                    <label class="field-label" for="email" data-i18n="email">Email</label>
                    <input class="field" style="margin-bottom:16px;" type="email" name="email" id="email"
                           placeholder="jan@ekomat.pl" autocomplete="username" autofocus required>

                    <label class="field-label" for="password" data-i18n="password">Hasło</label>
                    <input class="field" style="margin-bottom:22px;" type="password" name="password" id="password"
                           placeholder="••••••••" autocomplete="current-password" required>

                    <button class="btn btn-block" type="submit" data-i18n="signin_btn">Zaloguj się</button>
                </form>
            </div>

            <p style="text-align:center;font-size:12px;color:var(--faint);margin:18px 0 0;">
                © 2026 EKOMAT · <span data-i18n="rights">Wszystkie prawa zastrzeżone</span>
            </p>
        </div>
    </div>

    <script src="/static/i18n.js"></script>
</body>
</html>
